name: Deploy Hellar to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hellar-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HELLAR_APP_ORIGIN: ${{ vars.HELLAR_APP_ORIGIN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check deployment settings
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set CLOUDFLARE_ACCOUNT_ID in GitHub Secrets'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set CLOUDFLARE_API_TOKEN in GitHub Secrets'; exit 1; }
      - name: Check email and captcha settings
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          for setting in RESEND_API_KEY MAIL_FROM TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
            test -n "${!setting}" || { echo "Add $setting to repository Actions secrets before deploying email and captcha"; exit 1; }
          done
          case "$TURNSTILE_SITE_KEY" in 1x*|2x*|3x*) echo 'Use a production Turnstile site key'; exit 1;; esac
          case "$TURNSTILE_SECRET_KEY" in 1x*|2x*|3x*) echo 'Use a production Turnstile secret key'; exit 1;; esac
      - name: Determine site address
        run: node scripts/resolve-cloudflare-origin.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - name: Ensure dedicated R2 bucket exists
        run: node scripts/ensure-cloudflare.mjs
      - name: Deploy site and database namespace
        run: npx wrangler deploy --var "APP_ORIGIN:$HELLAR_APP_ORIGIN"
      - name: Install application secrets if supplied
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SETUP_TOKEN: ${{ secrets.HELLAR_SETUP_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/cloudflare-secrets.mjs
      - name: Check deployed health
        run: |
          curl --fail --silent --show-error --retry 3 "$HELLAR_APP_ORIGIN/api/health"
