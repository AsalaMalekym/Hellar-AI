name: Check Hellar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
